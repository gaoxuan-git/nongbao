<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="760" viewBox="0 0 1060 760" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif"><rect width="1060" height="760" fill="#ffffff"/><defs><marker id="ah-slate" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#475569"/></marker><marker id="ah-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#2563eb"/></marker><marker id="ah-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#16a34a"/></marker><marker id="ah-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#d97706"/></marker><marker id="ah-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#7c3aed"/></marker><marker id="ah-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#dc2626"/></marker></defs><text x="530.0" y="36.0" font-size="21" fill="#0f172a" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif">Spring Boot 启动与自动配置流程</text><rect x="70" y="86" width="660" height="72" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/><text x="400.0" y="116.345" font-size="14.5" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif">① 启动类 main() 调用 SpringApplication.run()</text><text x="400.0" y="138.095" font-size="14.5" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif">NbspringproductApplication</text><line x1="400.0" y1="159" x2="400.0" y2="174" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-blue)"/><rect x="70" y="176" width="660" height="72" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/><text x="400.0" y="206.345" font-size="14.5" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif">② @SpringBootApplication 组合注解</text><text x="400.0" y="228.095" font-size="14.5" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif">@SpringBootConfiguration + @EnableAutoConfiguration + @ComponentScan</text><line x1="400.0" y1="249" x2="400.0" y2="264" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-blue)"/><rect x="70" y="266" width="660" height="72" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/><text x="400.0" y="296.345" font-size="14.5" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif">③ 自动配置：加载 spring.factories，@Conditional 按条件装配</text><text x="400.0" y="318.095" font-size="14.5" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif">DataSource / SqlSessionFactory / DispatcherServlet …</text><line x1="400.0" y1="339" x2="400.0" y2="354" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-blue)"/><rect x="70" y="356" width="660" height="72" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/><text x="400.0" y="386.345" font-size="14.5" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif">④ 组件扫描：Controller、Service、Mapper 代理注册进 IoC 容器</text><text x="400.0" y="408.095" font-size="14.5" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif">@MapperScan 为 Mapper 接口创建动态代理</text><line x1="400.0" y1="429" x2="400.0" y2="444" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-blue)"/><rect x="70" y="446" width="660" height="72" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/><text x="400.0" y="476.345" font-size="14.5" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif">⑤ 起步依赖传递引入内嵌 Tomcat、MyBatis-Plus、Validation</text><text x="400.0" y="498.095" font-size="14.5" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif">starter 一站式依赖管理，版本自动对齐</text><line x1="400.0" y1="519" x2="400.0" y2="534" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-blue)"/><rect x="70" y="536" width="660" height="72" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/><text x="400.0" y="566.345" font-size="14.5" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif">⑥ 内嵌 Tomcat 启动，DispatcherServlet 就绪，监听 80 端口</text><text x="400.0" y="588.095" font-size="14.5" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif">无需外部 Tomcat、无需 web.xml</text><line x1="400.0" y1="609" x2="400.0" y2="624" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-blue)"/><rect x="70" y="626" width="660" height="72" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/><text x="400.0" y="656.345" font-size="14.5" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif">⑦ HTTP 请求进入三层架构处理并返回 Result</text><text x="400.0" y="678.095" font-size="14.5" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif">Controller → Service → Mapper → MySQL</text><rect x="770" y="86" width="240" height="588" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/><text x="890.0" y="385.76" font-size="16" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif">关键机制</text><rect x="788" y="130" width="204" height="96" rx="10" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.3"/><text x="890.0" y="164.0" font-size="13.5" fill="#0f172a" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif">约定优于配置：</text><text x="890.0" y="184.925" font-size="13.5" fill="#0f172a" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif">默认值替代手写 XML</text><rect x="788" y="248" width="204" height="96" rx="10" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.3"/><text x="890.0" y="282.0" font-size="13.5" fill="#0f172a" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif">条件装配：</text><text x="890.0" y="302.925" font-size="13.5" fill="#0f172a" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif">@ConditionalOnClass /</text><text x="890.0" y="323.85" font-size="13.5" fill="#0f172a" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif">@ConditionalOnMissingBean</text><rect x="788" y="366" width="204" height="96" rx="10" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.3"/><text x="890.0" y="400.0" font-size="13.5" fill="#0f172a" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif">内嵌容器：</text><text x="890.0" y="420.925" font-size="13.5" fill="#0f172a" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif">Tomcat 作为 Bean 托管</text><rect x="788" y="484" width="204" height="96" rx="10" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.3"/><text x="890.0" y="518.0" font-size="13.5" fill="#0f172a" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif">可扩展：</text><text x="890.0" y="538.925" font-size="13.5" fill="#0f172a" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif">自定义 Bean 可覆盖</text><text x="890.0" y="559.85" font-size="13.5" fill="#0f172a" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif">自动配置默认值</text><text x="530.0" y="744.0" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif">图 4-1 示例图：从启动类到三层调用的自动装配全链路（学生可提交自绘版本）</text></svg>